<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Americano</title>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#16221a;--mute:#66746a;--line:#dbe3dc;--acc:#1f9d55;--acc2:#e6f5ec;--warn:#c0392b;--hero:linear-gradient(135deg,#0f7a43,#2bbf72);--sh:0 2px 10px rgba(20,40,28,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1410;--card:#18211b;--ink:#eef3ee;--mute:#93a197;--line:#2a352d;--acc:#3ecf7c;--acc2:#16291e;--warn:#ff7b6b;--hero:linear-gradient(135deg,#0c4a2a,#1b8f52);--sh:none}}
:root[data-theme="dark"]{--bg:#0e1410;--card:#18211b;--ink:#eef3ee;--mute:#93a197;--line:#2a352d;--acc:#3ecf7c;--acc2:#16291e;--warn:#ff7b6b;--hero:linear-gradient(135deg,#0c4a2a,#1b8f52);--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:14px}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px 22px;margin-bottom:14px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:28px;letter-spacing:-.02em}.hero p{margin:4px 0 0;opacity:.9;font-size:15px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:8px}
h2{font-size:19px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);padding:6px;border-radius:16px;box-shadow:var(--sh)}
button,.chip{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
.tab{flex:1;border:0;background:transparent;font-weight:600;color:var(--mute)}.tab.on{background:var(--acc);color:#fff}.tab:disabled{opacity:.4}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;width:100%}
button.sec{background:transparent}button.dng{color:var(--warn)}button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
label{display:block;font-weight:600;margin:12px 0 6px}
textarea,input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:190px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mute{color:var(--mute);font-size:15px}.err{color:var(--warn);font-weight:600;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:0 0 auto;min-width:56px;padding:10px 14px;font-weight:600}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.match{border:1px solid var(--line);border-top:6px solid var(--cc);border-radius:16px;padding:12px 14px;background:var(--card)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mh b{font-size:18px;color:var(--cc)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:700;white-space:nowrap}.tag.w{background:#fdecd6;color:#b8650a}
.team{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px}
.team.win{background:var(--acc2)}
.team .n{flex:1;font-weight:700;font-size:18px}
.team input{width:88px;text-align:center;font-size:24px;font-weight:800;padding:10px}
.vs{text-align:center;color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pause{background:var(--acc2);border-radius:12px;padding:10px 14px;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);text-transform:uppercase}
td.nm,th.nm{text-align:left;font-weight:700}
tr.top td{background:var(--acc2)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>🎾 Padel Americano</h1><p id="sub">Turnier einrichten und auslosen</p><div class="bar" id="bar" style="display:none"><i id="fill"></i></div></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
const KEY="padel-americano-v1",CC=["#1f9d55","#2d7ff9","#e8833a","#9b59d0","#e0457b","#17a2b8"];
let S={players:"",courts:2,points:24,rounds:6,courtNames:[],schedule:[],tab:"setup",round:0,err:"",msg:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const names=()=>S.players.split("\n").map(s=>s.trim()).filter(Boolean);
const cn=i=>((S.courtNames||[])[i-1]||"").trim()||"Court "+i;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pk=(a,b)=>a<b?a+"-"+b:b+"-"+a;
const mk=(p,q)=>p<q?p+"|"+q:q+"|"+p;

function history(upTo,n){
  const partner={},opp={},ms={},games=Array(n).fill(0),lastSit=Array(n).fill(-1);
  const inc=(o,k)=>{o[k]=(o[k]||0)+1};
  for(let r=0;r<upTo;r++){const R=S.schedule[r];
    R.pause.forEach(p=>{lastSit[p]=r});
    R.matches.forEach(m=>{
      const a=pk(m.t1[0],m.t1[1]),b=pk(m.t2[0],m.t2[1]);
      inc(partner,a);inc(partner,b);inc(ms,mk(a,b));
      m.t1.forEach(x=>m.t2.forEach(y=>inc(opp,pk(x,y))));
      m.t1.concat(m.t2).forEach(p=>{games[p]++});
    });}
  return {partner,opp,ms,games,lastSit};
}
/* beste Aufteilung von 4 Spielern in 2 Teams: Partner-Wiederholung wiegt am schwersten, dann gleiche Paarung, dann Gegner */
function best3(q,h){
  const [a,b,x,y]=q;let bo=null,bc=1e9;
  for(const [t1,t2] of [[[a,b],[x,y]],[[a,x],[b,y]],[[a,y],[b,x]]]){
    const p1=pk(t1[0],t1[1]),p2=pk(t2[0],t2[1]),c1=h.partner[p1]||0,c2=h.partner[p2]||0;
    let k=(c1*c1+c2*c2)*1000+(h.ms[mk(p1,p2)]||0)*600;
    t1.forEach(p=>t2.forEach(o=>{const c=h.opp[pk(p,o)]||0;k+=c*c*25}));
    if(k<bc){bc=k;bo=[t1,t2]}
  }
  return [bc,bo];
}
function genRound(n,courts,h){
  const nSit=n-courts*4;
  /* Pause: wer die meisten Spiele hat; bei Gleichstand wer am längsten nicht pausiert hat; sonst Zufall */
  const order=shuffle([...Array(n).keys()]).sort((a,b)=>(h.games[b]-h.games[a])||(h.lastSit[a]-h.lastSit[b]));
  const pause=order.slice(0,nSit),active=order.slice(nSit);
  const ev=sh=>{let t=0;const ms=[];for(let c=0;c<courts;c++){const [k,bo]=best3(sh.slice(c*4,c*4+4),h);t+=k;ms.push(bo)}return [t,ms]};
  let best=null,bc=1e9;
  for(let it=0;it<40&&bc>0;it++){
    const sh=shuffle(active);let [cur,ms]=ev(sh),imp=true;
    while(imp&&cur>0){imp=false;
      for(let i=0;i<sh.length&&cur>0;i++)for(let j=i+1;j<sh.length;j++){
        if((i>>2)===(j>>2))continue;
        [sh[i],sh[j]]=[sh[j],sh[i]];
        const [k,m2]=ev(sh);
        if(k<cur){cur=k;ms=m2;imp=true}else{[sh[i],sh[j]]=[sh[j],sh[i]]}
      }}
    if(cur<bc){bc=cur;best=ms}
  }
  return {matches:best.map(([t1,t2],c)=>({court:c+1,t1,t2,s1:null,s2:null})),pause};
}
function buildFrom(start){
  const n=names().length,ec=Math.min(S.courts,Math.floor(n/4));
  S.schedule=S.schedule.slice(0,start);
  for(let r=start;r<S.rounds;r++)S.schedule.push(genRound(n,ec,history(r,n)));
}
function start(){
  const ps=names(),n=ps.length;
  const uniq=new Set(ps.map(p=>p.toLowerCase()));
  S.courts=Math.max(1,parseInt(S.courts)||1);S.points=Math.max(1,parseInt(S.points)||1);S.rounds=Math.max(1,parseInt(S.rounds)||1);
  if(n<4){S.err="Mindestens 4 Spieler nötig.";return render()}
  if(uniq.size!==n){S.err="Bitte jeden Namen nur einmal verwenden.";return render()}
  const maxC=Math.floor(n/4);
  if(S.courts>maxC){S.err="Mit "+n+" Spielern sind maximal "+maxC+" Court(s) möglich (4 Spieler pro Court).";return render()}
  S.err="";S.schedule=[];buildFrom(0);S.round=0;S.tab="rounds";save();render();
}
function resetAll(){
  if(!confirm("Turnier wirklich beenden und neu einrichten? Alle Ergebnisse gehen verloren."))return;
  S.schedule=[];S.tab="setup";save();render();
}
function setScore(r,m,side,val){
  const M=S.schedule[r].matches[m];
  const v=val===""?null:Math.max(0,Math.min(S.points,parseInt(val)));
  if(v===null){M.s1=null;M.s2=null}
  else if(side===1){M.s1=v;M.s2=S.points-v}
  else{M.s2=v;M.s1=S.points-v}
  save();render();
}
function reshuffle(){
  const r=S.round;
  for(let i=r;i<S.schedule.length;i++)if(S.schedule[i].matches.some(m=>m.s1!==null)){
    alert("Ab dieser Runde sind schon Ergebnisse eingetragen – neu auslosen nicht möglich.");return}
  buildFrom(r);save();render();
}
function addPlayer(){
  const nm=document.getElementById("np").value.trim();
  if(!nm)return;
  const ps=names();
  if(ps.some(p=>p.toLowerCase()===nm.toLowerCase())){S.msg="⚠️ Diesen Namen gibt es schon.";return render()}
  S.players=ps.concat(nm).join("\n");
  let last=-1;S.schedule.forEach((R,i)=>{if(R.matches.some(m=>m.s1!==null))last=i});
  const from=last+1;
  if(from>=S.schedule.length){S.msg="✅ "+nm+" ist dabei. Alle bisherigen Runden sind schon gespielt – mit „+ Weitere Runde“ spielt er mit."}
  else{buildFrom(from);S.round=from;S.msg="✅ "+nm+" ist dabei. Runde "+(from+1)+" bis "+S.schedule.length+" wurden neu ausgelost; "+nm+" bekommt vorrangig Spiele, damit am Ende alle ähnlich viele haben."}
  save();render();
}
function addRound(){
  const n=names().length,ec=Math.min(S.courts,Math.floor(n/4));
  S.schedule.push(genRound(n,ec,history(S.schedule.length,n)));
  S.rounds=S.schedule.length;S.round=S.schedule.length-1;save();render();
}
function standings(){
  const ps=names(),T=ps.map((n,i)=>({i,n,pts:0,w:0,l:0,d:0,g:0}));
  S.schedule.forEach(R=>R.matches.forEach(m=>{
    if(m.s1===null)return;
    const add=(t,s,o)=>t.forEach(p=>{const x=T[p];x.pts+=s;x.g++;if(s>o)x.w++;else if(s<o)x.l++;else x.d++});
    add(m.t1,m.s1,m.s2);add(m.t2,m.s2,m.s1);
  }));
  return T.sort((a,b)=>b.pts-a.pts||b.w-a.w||a.n.localeCompare(b.n));
}
function render(){
  const has=S.schedule.length>0;
  let tot=0,done=0;S.schedule.forEach(R=>R.matches.forEach(m=>{tot++;if(m.s1!==null)done++}));
  document.getElementById("bar").style.display=has?"block":"none";
  document.getElementById("fill").style.width=(tot?done/tot*100:0)+"%";
  document.getElementById("sub").textContent=has?names().length+" Spieler · "+S.schedule.length+" Runden · "+done+" von "+tot+" Matches gespielt":"Turnier einrichten und auslosen";
  const tabs=[["setup","⚙️ Einrichtung"],["rounds","🎾 Runden"],["table","🏆 Rangliste"]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>
    `<button class="tab ${S.tab===k?"on":""}" ${k!=="setup"&&!has?"disabled":""} onclick="S.tab='${k}';save();render()">${l}</button>`).join("");
  const v=document.getElementById("view");
  if(S.tab==="setup"||!has){
    const n=names().length,nc=Math.min(Math.max(1,parseInt(S.courts)||1),12);
    const cin=Array.from({length:nc},(_,i)=>`<input placeholder="Court ${i+1}" value="${esc((S.courtNames||[])[i]||"")}" oninput="S.courtNames[${i}]=this.value;save()">`).join("");
    v.innerHTML=`<div class="card"><h2>Spieler</h2>
      <label for="pl">Namen (einer pro Zeile)</label>
      <textarea id="pl" placeholder="Anna&#10;Ben&#10;Chris&#10;Dana" oninput="S.players=this.value;save();document.getElementById('cnt').textContent=names().length+' Spieler'">${esc(S.players)}</textarea>
      <div class="mute" id="cnt" style="margin-top:6px">${n} Spieler</div></div>
      <div class="card"><h2>Einstellungen</h2><div class="grid3">
      <div><label for="c">Courts</label><input id="c" type="number" inputmode="numeric" min="1" value="${S.courts}" onchange="S.courts=Math.max(1,parseInt(this.value)||1);save();render()"></div>
      <div><label for="p">Punkte pro Match</label><input id="p" type="number" inputmode="numeric" min="1" value="${S.points}" onchange="S.points=this.value;save()"></div>
      <div><label for="r">Runden</label><input id="r" type="number" inputmode="numeric" min="1" value="${S.rounds}" onchange="S.rounds=this.value;save()"></div></div>
      <label>Court-Namen (optional)</label><div class="grid2">${cin}</div>
      <p class="mute">Die Auslosung vermeidet wiederholte Partner und gleiche Paarungen, so gut es die Spielerzahl zulässt. Wer nicht auf einen Court passt, pausiert – bevorzugt wer schon die meisten Spiele hat; wer gerade pausiert hat, spielt in der nächsten Runde.</p>
      ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
      <button class="pri" onclick="S.players=document.getElementById('pl').value;start()">${has?"Neu auslosen & starten":"Turnier auslosen & starten"}</button>
      ${has?`<button class="sec dng" style="width:100%;margin-top:10px" onclick="resetAll()">Turnier zurücksetzen</button>`:""}</div>`;
    return;
  }
  const ps=names();
  if(S.tab==="rounds"){
    const R=S.schedule[S.round],h=history(S.round,ps.length),msg=S.msg||"";S.msg="";
    const chips=S.schedule.map((_,i)=>`<button class="chip ${i===S.round?"on":""}" onclick="S.round=${i};save();render()">R${i+1}</button>`).join("");
    const nm=t=>t.map(p=>esc(ps[p])).join(" &amp; ");
    const cards=R.matches.map((m,mi)=>{
      const rep=(h.partner[pk(m.t1[0],m.t1[1])]||0)+(h.partner[pk(m.t2[0],m.t2[1])]||0);
      const w1=m.s1!==null&&m.s1>m.s2,w2=m.s2!==null&&m.s2>m.s1;
      return `<div class="match" style="--cc:${CC[(m.court-1)%CC.length]}"><div class="mh"><b>${esc(cn(m.court))}</b><span class="tag ${rep?"w":""}">${rep?"↺ Partner wiederholt":"✨ neue Partner"}</span></div>
      <div class="team ${w1?"win":""}"><div class="n">${nm(m.t1)}</div><input type="number" inputmode="numeric" min="0" max="${S.points}" value="${m.s1===null?"":m.s1}" onchange="setScore(${S.round},${mi},1,this.value)"></div>
      <div class="vs">gegen</div>
      <div class="team ${w2?"win":""}"><div class="n">${nm(m.t2)}</div><input type="number" inputmode="numeric" min="0" max="${S.points}" value="${m.s2===null?"":m.s2}" onchange="setScore(${S.round},${mi},2,this.value)"></div></div>`}).join("");
    v.innerHTML=`<div class="chips">${chips}</div><div class="card"><h2>Runde ${S.round+1} von ${S.schedule.length}</h2>
      <div class="courts">${cards}</div>
      ${R.pause.length?`<div class="pause"><b>⏸ Pause:</b> ${R.pause.map(p=>esc(ps[p])).join(", ")}</div>`:""}
      <div class="row" style="margin-top:14px"><button onclick="reshuffle()">🔀 Diese Runde neu auslosen</button>
      <button class="sec" ${S.round===0?"disabled":""} onclick="S.round--;save();render()">← Zurück</button>
      <button class="sec" ${S.round>=S.schedule.length-1?"disabled":""} onclick="S.round++;save();render()">Weiter →</button></div>
      <p class="mute">Trage die Punkte eines Teams ein – das andere Team wird automatisch ergänzt.</p></div>
      <div class="card"><h2>Spieler nachträglich hinzufügen</h2>${msg?`<div class="pause" style="margin:0 0 10px">${esc(msg)}</div>`:""}
      <div class="row"><input id="np" placeholder="Name" onkeydown="if(event.key==='Enter')addPlayer()"><button class="pri" style="width:auto;flex:0 0 auto" onclick="addPlayer()">Hinzufügen</button></div>
      <p class="mute">Alle Runden ohne eingetragene Ergebnisse werden neu ausgelost.</p>
      <button class="sec" onclick="addRound()">+ Weitere Runde</button></div>`;
    return;
  }
  const T=standings(),medal=["🥇","🥈","🥉"];
  v.innerHTML=`<div class="card"><h2>Rangliste</h2><table><tr><th>#</th><th class="nm">Spieler</th><th>Punkte</th><th>Spiele</th><th>S</th><th>U</th><th>N</th></tr>
    ${T.map((x,i)=>`<tr class="${i<3&&x.g?"top":""}"><td>${i<3&&x.g?medal[i]:i+1}</td><td class="nm">${esc(x.n)}</td><td><b>${x.pts}</b></td><td>${x.g}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td></tr>`).join("")}</table>
    <p class="mute">Gewertet wird die Summe der selbst erspielten Punkte; bei Gleichstand zählen Siege.</p></div>`;
}
render();
</script>
</body>
</html>
